<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="sa-seq-ja-t sa-seq-ja-d">
  <title id="sa-seq-ja-t">1 回のリモート実行をフレーム単位で追う</title>
  <desc id="sa-seq-ja-d">左から右へ時間が進む 2 本のレーンです。上はワークステーションの shim、下はビルドホストの sendaway remote-exec で、両者は ssh の ControlMaster が 10 分間維持する 1 本の ssh 接続でつながっています。 shim はまずプロジェクトのルートを確認し、実行記録を作り、ローカルロックを取ります。続いて、1 でホストが hello を送り、2 で shim が request を JSON 1 行で送ります。3 でホストはリモートロックを取り、時刻差と min_free の下限を確認します。4 で今回送られないファイルを削除し、5 で ready を送ります。6 で shim が作業ツリー用と .git 用の 2 つの rsync を並列に動かして push し、7 で pushed を送ります。8 でホストは when のファイルが変わった prepare ルールだけを実行し、9 でコマンドを専用のプロセスグループで $SHELL -lc 経由で起動します。out・err・note のフレームが流れ、 shim はそれを stdout・stderr・[sendaway] 行に書き出します。exit フレームには終了コードと回収するファイルが入っており、 shim は exit 0 なら pull: のパスを、それ以外なら artifacts: のパスをコピーしてからトレーラーを表示します。下の帯は区間ごとの失敗の意味を示します。hello より前にネットワークに到達できなければローカルで実行します。hello の後、pushed より前に接続が切れると connection lost during sync — nothing ran、pushed の後なら connection lost during run — result unknown と報告し、どちらも exit 125 で終わります。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .lnd   { fill:none; stroke:#8a6a1f; stroke-width:1.2; stroke-dasharray:4 3 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .wseam { fill:none; stroke:#a3401f; stroke-width:1.2; stroke-dasharray:5 4 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .hb    { font-size:12.5px; font-weight:600 }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .code  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#1f2328 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .lnd{stroke:#d9b45c} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .wseam{stroke:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e} .code{fill:#e6edf3} .warnt{fill:#e08a68}
    }
  </style>

  <defs>
    <marker id="sa-seq-ja-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-seq-ja-a2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="392" rx="12"/>
  <rect class="grp" x="24" y="20" width="912" height="98" rx="8"/>
  <text class="lbl" x="36" y="38">ワークステーション — shim</text>
  <rect class="grp" x="24" y="170" width="912" height="120" rx="8"/>
  <text class="lbl" x="36" y="188">ビルドホスト</text>
  <text class="code" x="36" y="202">sendaway remote-exec</text>
  <text class="lbl" x="36" y="134">ssh 接続は 1 本</text>
  <text class="s" x="36" y="148">ControlMaster が</text>
  <text class="s" x="36" y="162">10 分間維持</text>
  <rect class="grp" x="24" y="298" width="912" height="56" rx="8"/>
  <path class="wseam" d="M170,170 V354"/>
  <path class="wseam" d="M540,170 V354"/>
  <path class="ln2" d="M170,170 V118" marker-end="url(#sa-seq-ja-a2)"/>
  <text class="lbl" x="176" y="138">1</text>
  <text class="code" x="186" y="138">hello</text>
  <path class="ln" d="M226,118 V170" marker-end="url(#sa-seq-ja-a)"/>
  <text class="lbl" x="232" y="138">2</text>
  <text class="code" x="242" y="138">request</text>
  <text class="s" x="232" y="152">JSON を 1 行</text>
  <path class="ln2" d="M392,170 V118" marker-end="url(#sa-seq-ja-a2)"/>
  <text class="lbl" x="398" y="138">5</text>
  <text class="code" x="408" y="138">ready</text>
  <path class="lnd" d="M468,110 V170" marker-end="url(#sa-seq-ja-a)"/>
  <path class="lnd" d="M486,110 V170" marker-end="url(#sa-seq-ja-a)"/>
  <text class="s" x="494" y="144">ファイル</text>
  <path class="ln" d="M540,118 V170" marker-end="url(#sa-seq-ja-a)"/>
  <text class="lbl" x="546" y="138">7</text>
  <text class="code" x="556" y="138">pushed</text>
  <path class="ln2" d="M760,170 V118" marker-end="url(#sa-seq-ja-a2)"/>
  <path class="ln2" d="M772,170 V118" marker-end="url(#sa-seq-ja-a2)"/>
  <path class="ln2" d="M784,170 V118" marker-end="url(#sa-seq-ja-a2)"/>
  <text class="code" x="752" y="138" text-anchor="end">out · err · note</text>
  <path class="ln2" d="M820,170 V118" marker-end="url(#sa-seq-ja-a2)"/>
  <text class="code" x="826" y="138">exit</text>
  <text class="s" x="826" y="152">コードと回収対象</text>
  <rect class="card" x="36" y="46" width="124" height="54" rx="6"/>
  <text class="h" x="46" y="64">前提条件</text>
  <text class="s" x="46" y="79">ルート確認・実行記録</text>
  <text class="s" x="46" y="92">ローカルロック</text>
  <rect class="card" x="400" y="46" width="132" height="54" rx="6"/>
  <text class="lbl" x="410" y="64">6</text>
  <text class="h" x="424" y="64">push</text>
  <text class="s" x="410" y="79">2 つの rsync を並列に</text>
  <text class="s" x="410" y="92">ツリーと .git</text>
  <rect class="card" x="652" y="46" width="160" height="54" rx="6"/>
  <text class="h" x="662" y="64">出力</text>
  <text class="s" x="662" y="79">stdout と stderr へ、</text>
  <text class="s" x="662" y="92">通知は [sendaway] 行</text>
  <rect class="card" x="826" y="46" width="106" height="64" rx="6"/>
  <text class="h" x="836" y="64">回収</text>
  <text class="s" x="836" y="79">exit 0 で pull:</text>
  <text class="s" x="836" y="92">他は artifacts:</text>
  <text class="s" x="836" y="105">その後トレーラー</text>
  <rect class="alt" x="232" y="198" width="144" height="38" rx="6"/>
  <text class="lbl" x="242" y="214">3</text>
  <text class="h" x="256" y="214">リモートロック</text>
  <text class="s" x="242" y="229">時刻差・min_free 確認</text>
  <rect class="alt" x="232" y="244" width="144" height="38" rx="6"/>
  <text class="lbl" x="242" y="260">4</text>
  <text class="h" x="256" y="260">削除</text>
  <text class="s" x="242" y="275">今回送らないファイル</text>
  <rect class="alt" x="552" y="198" width="122" height="84" rx="6"/>
  <text class="lbl" x="562" y="214">8</text>
  <text class="h" x="576" y="214">prepare</text>
  <text class="s" x="562" y="229">when のファイルが</text>
  <text class="s" x="562" y="243">変わったルールだけ</text>
  <rect class="alt" x="682" y="198" width="130" height="84" rx="6"/>
  <text class="lbl" x="692" y="214">9</text>
  <text class="h" x="706" y="214">コマンド</text>
  <text class="s" x="692" y="229">専用プロセスグループ</text>
  <text class="code" x="692" y="243">$SHELL -lc</text>
  <text class="lbl" x="36" y="316">hello より前</text>
  <text class="s" x="36" y="331">ネットワーク到達不能:</text>
  <text class="s" x="36" y="345">ローカルで実行 (nice 10)</text>
  <text class="lbl" x="182" y="316">pushed より前に切断</text>
  <text class="code" x="182" y="331"><tspan class="warnt">connection lost during sync — nothing ran</tspan></text>
  <text class="s" x="182" y="345">exit 125</text>
  <text class="lbl" x="552" y="316">pushed より後に切断</text>
  <text class="code" x="552" y="331"><tspan class="warnt">connection lost during run — result unknown</tspan></text>
  <text class="s" x="552" y="345">exit 125</text>
  <text class="s" x="480" y="378" text-anchor="middle">pushed が届くまでホストは何も始めないため、それより前の切断は「何も実行されていない」を意味します。</text>
</svg>
