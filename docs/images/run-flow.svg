<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="sa-run-t sa-run-d">
  <title id="sa-run-t">How a command runs through sendaway</title>
  <desc id="sa-run-d">Three panels, left to right. On the Mac, a command such as make test, typed in a terminal, run by a script, or issued by Claude Code or Codex, reaches the sendaway shim, which sits first on PATH. Rules in .sendaway.yml decide where it runs; when no rule matches, or a local rule wins, the real binary runs locally. A remote match goes to the sync stage, just before the run: the file set comes from git, meaning tracked files plus untracked files that are not ignored; secret-like files are held back; rsync copies the rest one way to the same absolute path on the build host. On the Linux build host, remote-exec takes a per-project lock and removes files deleted locally, prepare runs only when one of its watched files changed, and the command runs in its own process group under the login shell. Output frames stream back while it runs, then the exit code. On exit 0 the pull paths come back after a magic-byte check that refuses native binaries and archives. The Mac sees the same output and exit code as a local run.</desc>

  <style>
    .bg   { fill:#f6f7f9 }
    .grp  { fill:#eceef2 }
    .chip { fill:#ffffff; stroke:#d5d9e0 }
    .card { fill:#ffffff; stroke:#2b6cb0 }
    .alt  { fill:#ffffff; stroke:#2a7f6f }
    rect.warn { fill:#ffffff; stroke:#a3401f }
    path.warn { fill:none; stroke:#a3401f; stroke-width:1.4 }
    .rule { fill:none; stroke:#c3c8d0; stroke-width:1 }
    .seam { fill:none; stroke:#c3c8d0; stroke-dasharray:6 5 }
    .ln   { fill:none; stroke:#2b6cb0; stroke-width:1.4 }
    .ah   { fill:#2b6cb0 }
    .ln2  { fill:none; stroke:#2a7f6f; stroke-width:1.4 }
    .ah2  { fill:#2a7f6f }
    .lnd  { fill:none; stroke:#2b6cb0; stroke-width:1.2; stroke-dasharray:4 3 }
    text  { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h    { font-size:12.5px }
    .hb   { font-size:12.5px; font-weight:600 }
    .lbl  { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s    { font-size:10.5px; fill:#6e7781 }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#2b6cb0 }
    .hm   { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px }
    .code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px }
    .warnt { fill:#a3401f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#7fb3d5} .alt{fill:#161b22;stroke:#6fc2ae}
      rect.warn{fill:#161b22;stroke:#e08a68} path.warn{stroke:#e08a68}
      .rule{stroke:#484f58} .seam{stroke:#484f58}
      .ln{stroke:#7fb3d5} .ah{fill:#7fb3d5} .ln2{stroke:#6fc2ae} .ah2{fill:#6fc2ae} .lnd{stroke:#7fb3d5}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e} .mono{fill:#7fb3d5} .warnt{fill:#e08a68}
    }
  </style>
  <defs>
    <marker id="sa-run-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-run-a2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="432" rx="12"/>

  <!-- panels -->
  <rect class="grp" x="24" y="40" width="288" height="338" rx="10"/>
  <rect class="grp" x="336" y="40" width="288" height="262" rx="10"/>
  <rect class="grp" x="648" y="40" width="288" height="338" rx="10"/>
  <text class="lbl" x="40" y="62">Mac</text>
  <text class="lbl" x="352" y="62">sync, just before the run</text>
  <text class="lbl" x="664" y="62">build host (Linux)</text>

  <!-- connectors, drawn under the boxes -->
  <path class="ln" d="M168,134 V152" marker-end="url(#sa-run-a)"/>
  <path class="ln" d="M168,210 V228" marker-end="url(#sa-run-a)"/>
  <path class="ln" d="M296,181 H324 V105 H352" marker-end="url(#sa-run-a)"/>
  <path class="ln" d="M480,134 V152" marker-end="url(#sa-run-a)"/>
  <path class="ln" d="M480,210 V228" marker-end="url(#sa-run-a)"/>
  <path class="ln" d="M608,257 H636 V105 H664" marker-end="url(#sa-run-a)"/>
  <path class="ln" d="M792,134 V152" marker-end="url(#sa-run-a)"/>
  <path class="ln" d="M792,210 V228" marker-end="url(#sa-run-a)"/>
  <path class="ln2" d="M792,286 V304" marker-end="url(#sa-run-a2)"/>
  <path class="ln2" d="M664,333 H296" marker-end="url(#sa-run-a2)"/>
  <text class="s" x="176" y="223">local</text>
  <text class="s" x="800" y="299">exit 0</text>
  <text class="s" x="480" y="325" text-anchor="middle">output frames while it runs, then the exit code</text>
  <text class="s" x="480" y="348" text-anchor="middle">pull: files after exit 0</text>

  <!-- Mac -->
  <rect class="chip" x="40" y="76" width="256" height="58" rx="7"/>
  <text class="hm" x="52" y="96">make test</text>
  <text class="s" x="52" y="112">from a terminal, a script,</text>
  <text class="s" x="52" y="125">Claude Code or Codex</text>
  <rect class="card" x="40" y="152" width="256" height="58" rx="7"/>
  <text class="lbl" x="50" y="172">1</text>
  <text class="h" x="66" y="172">sendaway shim</text>
  <text class="s" x="66" y="188">first on PATH</text>
  <text class="s" x="66" y="201">.sendaway.yml picks remote or local</text>
  <rect class="chip" x="40" y="228" width="256" height="58" rx="7"/>
  <text class="h" x="52" y="248">real binary, locally</text>
  <text class="s" x="52" y="264">when no rule matches,</text>
  <text class="s" x="52" y="277">or a local: rule wins</text>
  <rect class="alt" x="40" y="304" width="256" height="58" rx="7"/>
  <text class="lbl" x="50" y="324">9</text>
  <text class="h" x="66" y="324">same result as a local run</text>
  <text class="s" x="66" y="340">stdout and stderr, in order</text>
  <text class="s" x="66" y="353">then the exit code</text>

  <!-- sync -->
  <rect class="card" x="352" y="76" width="256" height="58" rx="7"/>
  <text class="lbl" x="362" y="96">2</text>
  <text class="h" x="378" y="96">file set from git</text>
  <text class="s" x="378" y="112">tracked files, plus untracked</text>
  <text class="s" x="378" y="125">files that are not ignored</text>
  <rect class="warn" x="352" y="152" width="256" height="58" rx="7"/>
  <text class="lbl" x="362" y="172">3</text>
  <text class="h" x="378" y="172">secret filter</text>
  <text class="s" x="378" y="188">.env, keys, credentials and</text>
  <text class="s" x="378" y="201">tokened .npmrc are held back</text>
  <rect class="card" x="352" y="228" width="256" height="58" rx="7"/>
  <text class="lbl" x="362" y="248">4</text>
  <text class="h" x="378" y="248">rsync, one way</text>
  <text class="s" x="378" y="264">to the same absolute path</text>
  <text class="s" x="378" y="277">on the build host</text>

  <!-- build host -->
  <rect class="card" x="664" y="76" width="256" height="58" rx="7"/>
  <text class="lbl" x="674" y="96">5</text>
  <text class="h" x="690" y="96">remote-exec</text>
  <text class="s" x="690" y="112">takes the per-project lock</text>
  <text class="s" x="690" y="125">removes files deleted locally</text>
  <rect class="card" x="664" y="152" width="256" height="58" rx="7"/>
  <text class="lbl" x="674" y="172">6</text>
  <text class="h" x="690" y="172">prepare</text>
  <text class="s" x="690" y="188">runs only when a when: file</text>
  <text class="s" x="690" y="201">changed, such as yarn.lock</text>
  <rect class="card" x="664" y="228" width="256" height="58" rx="7"/>
  <text class="lbl" x="674" y="248">7</text>
  <text class="h" x="690" y="248">the command</text>
  <text class="s" x="690" y="264">in its own process group</text>
  <text class="s" x="690" y="277">under the login shell</text>
  <rect class="alt" x="664" y="304" width="256" height="58" rx="7"/>
  <text class="lbl" x="674" y="324">8</text>
  <text class="h" x="690" y="324">pull, on exit 0</text>
  <text class="s" x="690" y="340">magic bytes checked per file</text>
  <text class="s" x="690" y="353">native binaries, archives refused</text>
  <path class="seam" d="M40,394 H920"/>
  <text class="s" x="480.0" y="416" text-anchor="middle">The same output and exit code as a local run: only what git lists goes out, and no native binary comes back.</text>
</svg>
