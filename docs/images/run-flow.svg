<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" width="960" height="472" role="img" aria-labelledby="sa-run-t sa-run-d">
  <title id="sa-run-t">How a command runs through sendaway</title>
  <desc id="sa-run-d">Three panels, left to right. On the Mac, a command such as make test, typed in a terminal, run by a script, or issued by Claude Code or Codex, reaches the sendaway shim, which sits first on PATH and reads .sendaway.yml. When no rule matches, a local rule wins, or there is no .sendaway.yml, the real binary runs locally. A remote match first builds the file set on the Mac: tracked files plus untracked files git does not ignore, minus secret-like files and exclude: paths. On the Linux build host, remote-exec starts over ssh, takes the per-project lock and removes files deleted locally; rsync then pushes the tree and .git one way to the same absolute path, leaving ignored paths on the host alone. prepare runs only when one of its when: files changed, and the command runs under the login shell in its own process group with an environment rebuilt from an allowlist. Output frames stream back while it runs, then the exit code and the collected files: pull: paths on exit 0, artifacts: paths on failure, with native binaries refused. The Mac sees the same output and exit code as a local run, and the run is recorded locally so sendaway last can read it again.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .hm    { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px }
    rect.warn { fill:#ffffff; stroke-width:1 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
      rect.warn{fill:#161b22}
    }
  </style>

  <defs>
    <marker id="sa-run-ma" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-run-mb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="472" rx="12"/>

  <!-- panels -->
  <rect class="grp" x="24" y="40" width="288" height="378" rx="10"/>
  <rect class="grp" x="336" y="40" width="288" height="174" rx="10"/>
  <rect class="grp" x="648" y="40" width="288" height="378" rx="10"/>
  <text class="lbl" x="40" y="62">Mac</text>
  <text class="lbl" x="352" y="62">on the Mac, before sending</text>
  <text class="lbl" x="664" y="62">build host (Linux)</text>

  <!-- connectors, drawn under the boxes -->
  <path class="ln" d="M168,130 V144" marker-end="url(#sa-run-ma)"/>
  <path class="ln" d="M168,198 V212" marker-end="url(#sa-run-ma)"/>
  <text class="s" x="176" y="208">local</text>
  <path class="ln2" d="M168,348 V334" marker-end="url(#sa-run-mb)"/>
  <path class="ln" d="M296,171 H324 V103 H352" marker-end="url(#sa-run-ma)"/>
  <path class="ln" d="M480,130 V144" marker-end="url(#sa-run-ma)"/>
  <path class="ln" d="M608,171 H636 V103 H664" marker-end="url(#sa-run-ma)"/>
  <path class="ln" d="M792,130 V144" marker-end="url(#sa-run-ma)"/>
  <path class="ln" d="M792,198 V212" marker-end="url(#sa-run-ma)"/>
  <path class="ln" d="M792,266 V280" marker-end="url(#sa-run-ma)"/>
  <path class="ln2" d="M792,334 V348" marker-end="url(#sa-run-mb)"/>
  <path class="ln2" d="M664,375 H296" marker-end="url(#sa-run-mb)"/>
  <text class="s" x="480" y="367" text-anchor="middle">output frames while the command runs</text>
  <text class="s" x="480" y="390" text-anchor="middle">then the exit code and the collected files</text>

  <!-- Mac -->
  <rect class="chip" x="40" y="76" width="256" height="54" rx="7"/>
  <text class="hm" x="52" y="96">make test</text>
  <text class="s" x="52" y="112">from a terminal, a script,</text>
  <text class="s" x="52" y="125">Claude Code or Codex</text>
  <rect class="card" x="40" y="144" width="256" height="54" rx="7"/>
  <text class="lbl" x="50" y="164">1</text>
  <text class="h" x="66" y="164">sendaway shim</text>
  <text class="s" x="66" y="180">first on PATH, reads .sendaway.yml</text>
  <text class="s" x="66" y="193">remote: match, and no local: match</text>
  <rect class="chip" x="40" y="212" width="256" height="54" rx="7"/>
  <text class="h" x="52" y="232">real binary, locally</text>
  <text class="s" x="52" y="248">no rule matches, a local: rule wins,</text>
  <text class="s" x="52" y="261">or no .sendaway.yml at all</text>
  <rect class="chip" x="40" y="280" width="256" height="54" rx="7"/>
  <text class="h" x="52" y="300">run record</text>
  <text class="s" x="52" y="316">output and meta.json, kept locally;</text>
  <text class="s" x="52" y="329">sendaway last reads it again</text>
  <rect class="alt" x="40" y="348" width="256" height="54" rx="7"/>
  <text class="lbl" x="50" y="368">9</text>
  <text class="h" x="66" y="368">same result as a local run</text>
  <text class="s" x="66" y="384">stdout and stderr, then the exit code</text>
  <text class="s" x="66" y="397">or death by the same signal</text>

  <!-- before sending -->
  <rect class="card" x="352" y="76" width="256" height="54" rx="7"/>
  <text class="lbl" x="362" y="96">2</text>
  <text class="h" x="378" y="96">file set from git</text>
  <text class="s" x="378" y="112">tracked files, plus untracked</text>
  <text class="s" x="378" y="125">files that are not ignored</text>
  <rect class="warn" x="352" y="144" width="256" height="54" rx="7"/>
  <text class="lbl" x="362" y="164">3</text>
  <text class="h" x="378" y="164">secret filter</text>
  <text class="s" x="378" y="180">.env, keys, tokened .npmrc and</text>
  <text class="s" x="378" y="193">exclude: paths are held back</text>

  <!-- build host -->
  <rect class="card" x="664" y="76" width="256" height="54" rx="7"/>
  <text class="lbl" x="674" y="96">4</text>
  <text class="h" x="690" y="96">remote-exec</text>
  <text class="s" x="690" y="112">started over ssh, takes the project lock</text>
  <text class="s" x="690" y="125">removes files deleted locally</text>
  <rect class="card" x="664" y="144" width="256" height="54" rx="7"/>
  <text class="lbl" x="674" y="164">5</text>
  <text class="h" x="690" y="164">push: rsync, one way</text>
  <text class="s" x="690" y="180">tree and .git to the same absolute path</text>
  <text class="s" x="690" y="193">ignored paths on the host are kept</text>
  <rect class="card" x="664" y="212" width="256" height="54" rx="7"/>
  <text class="lbl" x="674" y="232">6</text>
  <text class="h" x="690" y="232">prepare</text>
  <text class="s" x="690" y="248">runs only when a when: file changed,</text>
  <text class="s" x="690" y="261">such as yarn.lock</text>
  <rect class="card" x="664" y="280" width="256" height="54" rx="7"/>
  <text class="lbl" x="674" y="300">7</text>
  <text class="h" x="690" y="300">the command</text>
  <text class="s" x="690" y="316">login shell, its own process group</text>
  <text class="s" x="690" y="329">environment rebuilt from an allowlist</text>
  <rect class="alt" x="664" y="348" width="256" height="54" rx="7"/>
  <text class="lbl" x="674" y="368">8</text>
  <text class="h" x="690" y="368">collect files</text>
  <text class="s" x="690" y="384">pull: on exit 0, artifacts: on failure</text>
  <text class="s" x="690" y="397">native binaries are refused</text>

  <path class="seam" d="M40,434 H920"/>
  <text class="s" x="480" y="456" text-anchor="middle">The Mac sees the same output and exit code as a local run; only the filtered file set goes out, and no native binary comes back.</text>
</svg>
