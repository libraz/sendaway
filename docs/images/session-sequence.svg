<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="sa-seq-t sa-seq-d">
  <title id="sa-seq-t">One remote run, frame by frame</title>
  <desc id="sa-seq-d">Two horizontal lanes with time running left to right: the shim on the workstation above, sendaway remote-exec on the build host below, joined by one ssh connection that ssh's ControlMaster keeps open for ten minutes. The shim first checks the project root, creates the run record and takes the local lock. Then: 1, the host sends hello; 2, the shim sends the request as one JSON line; 3, the host takes the remote lock, checks the clock difference and the min_free floor; 4, it deletes the files this run no longer sends; 5, it sends ready; 6, the shim pushes with two rsyncs in parallel, one for the working tree and one for .git; 7, the shim sends pushed; 8, the host runs only the prepare rules whose when-files changed; 9, it runs the command in its own process group through $SHELL -lc, streaming out, err and note frames that the shim writes to stdout, stderr and [sendaway] lines. The exit frame carries the code and the files to collect; the shim copies the pull: paths on exit 0 or the artifacts: paths otherwise, then prints the trailer. A strip below marks what a failure means in each span: before hello an unreachable network runs the command locally; a connection lost after hello and before pushed reports connection lost during sync, nothing ran; after pushed it reports connection lost during run, result unknown. Both exit 125.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .lnd   { fill:none; stroke:#8a6a1f; stroke-width:1.2; stroke-dasharray:4 3 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .wseam { fill:none; stroke:#a3401f; stroke-width:1.2; stroke-dasharray:5 4 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .hb    { font-size:12.5px; font-weight:600 }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .code  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#1f2328 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .lnd{stroke:#d9b45c} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .wseam{stroke:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e} .code{fill:#e6edf3} .warnt{fill:#e08a68}
    }
  </style>

  <defs>
    <marker id="sa-seq-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-seq-a2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="392" rx="12"/>
  <rect class="grp" x="24" y="20" width="912" height="98" rx="8"/>
  <text class="lbl" x="36" y="38">workstation — shim</text>
  <rect class="grp" x="24" y="170" width="912" height="120" rx="8"/>
  <text class="lbl" x="36" y="188">build host</text>
  <text class="code" x="36" y="202">sendaway remote-exec</text>
  <text class="lbl" x="36" y="134">one ssh connection</text>
  <text class="s" x="36" y="148">ControlMaster keeps it</text>
  <text class="s" x="36" y="162">for 10 min</text>
  <rect class="grp" x="24" y="298" width="912" height="56" rx="8"/>
  <path class="wseam" d="M170,170 V354"/>
  <path class="wseam" d="M540,170 V354"/>
  <path class="ln2" d="M170,170 V118" marker-end="url(#sa-seq-a2)"/>
  <text class="lbl" x="176" y="138">1</text>
  <text class="code" x="186" y="138">hello</text>
  <path class="ln" d="M226,118 V170" marker-end="url(#sa-seq-a)"/>
  <text class="lbl" x="232" y="138">2</text>
  <text class="code" x="242" y="138">request</text>
  <text class="s" x="232" y="152">one JSON line</text>
  <path class="ln2" d="M392,170 V118" marker-end="url(#sa-seq-a2)"/>
  <text class="lbl" x="398" y="138">5</text>
  <text class="code" x="408" y="138">ready</text>
  <path class="lnd" d="M468,110 V170" marker-end="url(#sa-seq-a)"/>
  <path class="lnd" d="M486,110 V170" marker-end="url(#sa-seq-a)"/>
  <text class="s" x="494" y="144">files</text>
  <path class="ln" d="M540,118 V170" marker-end="url(#sa-seq-a)"/>
  <text class="lbl" x="546" y="138">7</text>
  <text class="code" x="556" y="138">pushed</text>
  <path class="ln2" d="M760,170 V118" marker-end="url(#sa-seq-a2)"/>
  <path class="ln2" d="M772,170 V118" marker-end="url(#sa-seq-a2)"/>
  <path class="ln2" d="M784,170 V118" marker-end="url(#sa-seq-a2)"/>
  <text class="code" x="752" y="138" text-anchor="end">out · err · note</text>
  <path class="ln2" d="M820,170 V118" marker-end="url(#sa-seq-a2)"/>
  <text class="code" x="826" y="138">exit</text>
  <text class="s" x="826" y="152">code, file list</text>
  <rect class="card" x="36" y="46" width="124" height="54" rx="6"/>
  <text class="h" x="46" y="64">preconditions</text>
  <text class="s" x="46" y="79">root check, run</text>
  <text class="s" x="46" y="92">record, local lock</text>
  <rect class="card" x="400" y="46" width="132" height="54" rx="6"/>
  <text class="lbl" x="410" y="64">6</text>
  <text class="h" x="424" y="64">push</text>
  <text class="s" x="410" y="79">two parallel rsyncs</text>
  <text class="s" x="410" y="92">tree and .git</text>
  <rect class="card" x="652" y="46" width="160" height="54" rx="6"/>
  <text class="h" x="662" y="64">output</text>
  <text class="s" x="662" y="79">to stdout and stderr,</text>
  <text class="s" x="662" y="92">notes as [sendaway]</text>
  <rect class="card" x="826" y="46" width="106" height="64" rx="6"/>
  <text class="h" x="836" y="64">collect</text>
  <text class="s" x="836" y="79">pull: on exit 0,</text>
  <text class="s" x="836" y="92">else artifacts:</text>
  <text class="s" x="836" y="105">then the trailer</text>
  <rect class="alt" x="232" y="198" width="144" height="38" rx="6"/>
  <text class="lbl" x="242" y="214">3</text>
  <text class="h" x="256" y="214">remote lock</text>
  <text class="s" x="242" y="229">clock check, min_free</text>
  <rect class="alt" x="232" y="244" width="144" height="38" rx="6"/>
  <text class="lbl" x="242" y="260">4</text>
  <text class="h" x="256" y="260">deletions</text>
  <text class="s" x="242" y="275">files no longer sent</text>
  <rect class="alt" x="552" y="198" width="122" height="84" rx="6"/>
  <text class="lbl" x="562" y="214">8</text>
  <text class="h" x="576" y="214">prepare</text>
  <text class="s" x="562" y="229">only rules whose</text>
  <text class="s" x="562" y="243">when-files changed</text>
  <rect class="alt" x="682" y="198" width="130" height="84" rx="6"/>
  <text class="lbl" x="692" y="214">9</text>
  <text class="h" x="706" y="214">command</text>
  <text class="s" x="692" y="229">own process group</text>
  <text class="code" x="692" y="243">$SHELL -lc</text>
  <text class="lbl" x="36" y="316">before hello</text>
  <text class="s" x="36" y="331">network unreachable:</text>
  <text class="s" x="36" y="345">runs locally, nice 10</text>
  <text class="lbl" x="182" y="316">connection lost before pushed</text>
  <text class="code" x="182" y="331"><tspan class="warnt">connection lost during sync — nothing ran</tspan></text>
  <text class="s" x="182" y="345">exit 125</text>
  <text class="lbl" x="552" y="316">connection lost after pushed</text>
  <text class="code" x="552" y="331"><tspan class="warnt">connection lost during run — result unknown</tspan></text>
  <text class="s" x="552" y="345">exit 125</text>
  <text class="s" x="480" y="378" text-anchor="middle">Nothing starts on the host until pushed arrives, which is why a connection lost before it means nothing ran.</text>
</svg>
