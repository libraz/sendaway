<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 578" width="960" height="578" role="img" aria-labelledby="sa-trust-t sa-trust-d">
  <title id="sa-trust-t">What crosses to the build host, and what never does</title>
  <desc id="sa-trust-d">The Mac is on the left, the build host on the right, and a dashed vertical line between them is the boundary. Sent to the host: the source files git lists, the .git objects, refs and index, the allowlisted environment variables plus names listed under env:, and the command line with its working directory. On the host these become a working copy at the same absolute path and the command's environment. Never sent: secret-like files such as .env, keys and an .npmrc holding a token; ignored files, whose copies on the host are left alone; .git/config, whose remote URLs can carry tokens; FETCH_HEAD, hooks and logs; environment variables with secret-like names or Mac-only path values; and ssh agent, X11 and port forwarding. The child environment on the host is built from scratch, so LANG and LC_* sent by ssh are discarded; the ssh options turn forwarding off; and .git/config on the host is written fresh with no remotes. Coming back: stdout and stderr as frames, each stream in order, the exit code or fatal signal, pull paths on exit 0 and artifacts on failure. Native binaries are refused by their magic bytes, and pull also refuses archives. On the Mac the caller sees the same output and exit code as a local run, pulled files land in the working tree, and the run record keeps output.log and artifacts outside the project tree.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .hb    { font-size:12.5px; font-weight:600 }
    rect.warn { fill:#ffffff; stroke-width:1 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
      rect.warn{fill:#161b22}
    }
  </style>

  <defs>
    <marker id="sa-trust-ma" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-trust-mb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="578" rx="12"/>
  <text class="hb" x="240" y="34" text-anchor="middle">Mac</text>
  <text class="hb" x="720" y="34" text-anchor="middle">build host</text>
  <text class="lbl" x="480" y="34" text-anchor="middle">boundary</text>

  <!-- band: sent -->
  <rect class="grp" x="24" y="52" width="432" height="120" rx="10"/>
  <rect class="grp" x="504" y="52" width="432" height="120" rx="10"/>
  <text class="lbl" x="40" y="70">sent to the host</text>
  <text class="lbl" x="520" y="70">arrives as</text>
  <rect class="card" x="40" y="80" width="196" height="38" rx="7"/>
  <text class="h" x="52" y="96">source files</text>
  <text class="s" x="52" y="112">only what git lists</text>
  <rect class="card" x="244" y="80" width="196" height="38" rx="7"/>
  <text class="h" x="256" y="96">.git data</text>
  <text class="s" x="256" y="112">objects, refs and the index</text>
  <rect class="card" x="40" y="122" width="196" height="38" rx="7"/>
  <text class="h" x="52" y="138">environment</text>
  <text class="s" x="52" y="154">allowlist, plus env: names</text>
  <rect class="card" x="244" y="122" width="196" height="38" rx="7"/>
  <text class="h" x="256" y="138">command line</text>
  <text class="s" x="256" y="154">argv and the working directory</text>
  <rect class="chip" x="520" y="80" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="96">working copy</text>
  <text class="s" x="532" y="112">at the same absolute path</text>
  <rect class="chip" x="520" y="122" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="138">command environment</text>
  <text class="s" x="532" y="154">only the forwarded names</text>
  <path class="ln" d="M456,120 H504" marker-end="url(#sa-trust-ma)"/>

  <!-- band: never sent -->
  <rect class="grp" x="24" y="184" width="432" height="162" rx="10"/>
  <rect class="grp" x="504" y="184" width="432" height="162" rx="10"/>
  <text class="lbl warnt" x="40" y="202">never sent</text>
  <text class="lbl" x="520" y="202">enforced on the connection and the host</text>
  <rect class="warn" x="40" y="212" width="196" height="38" rx="7"/>
  <text class="h" x="52" y="228">secret-like files</text>
  <text class="s" x="52" y="244">.env, keys, tokened .npmrc</text>
  <rect class="warn" x="244" y="212" width="196" height="38" rx="7"/>
  <text class="h" x="256" y="228">ignored files</text>
  <text class="s" x="256" y="244">the host's copies are left alone</text>
  <rect class="warn" x="40" y="254" width="196" height="38" rx="7"/>
  <text class="h" x="52" y="270">.git/config</text>
  <text class="s" x="52" y="286">remote URLs can hold tokens</text>
  <rect class="warn" x="244" y="254" width="196" height="38" rx="7"/>
  <text class="h" x="256" y="270">other .git state</text>
  <text class="s" x="256" y="286">FETCH_HEAD, hooks, logs</text>
  <rect class="warn" x="40" y="296" width="196" height="38" rx="7"/>
  <text class="h" x="52" y="312">dropped variables</text>
  <text class="s" x="52" y="328">secret names, Mac-only paths</text>
  <rect class="warn" x="244" y="296" width="196" height="38" rx="7"/>
  <text class="h" x="256" y="312">agent, X11, ports</text>
  <text class="s" x="256" y="328">forwarding is never opened</text>
  <rect class="chip" x="520" y="212" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="228">child environment</text>
  <text class="s" x="532" y="244">built from scratch; LANG and LC_* sent by ssh are discarded</text>
  <rect class="chip" x="520" y="254" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="270">ssh options</text>
  <text class="s" x="532" y="286">ForwardAgent=no, ForwardX11=no, ClearAllForwardings=yes</text>
  <rect class="chip" x="520" y="296" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="312">.git/config on the host</text>
  <text class="s" x="532" y="328">written fresh, with no remotes</text>
  <path class="warn" d="M456,273 H474 M474,266 V280"/>

  <!-- band: comes back -->
  <rect class="grp" x="24" y="358" width="432" height="162" rx="10"/>
  <rect class="grp" x="504" y="358" width="432" height="162" rx="10"/>
  <text class="lbl" x="40" y="376">comes back</text>
  <text class="lbl" x="520" y="376">sent back</text>
  <rect class="alt" x="520" y="386" width="196" height="38" rx="7"/>
  <text class="h" x="532" y="402">stdout, stderr</text>
  <text class="s" x="532" y="418">framed, each stream in order</text>
  <rect class="alt" x="724" y="386" width="196" height="38" rx="7"/>
  <text class="h" x="736" y="402">exit code</text>
  <text class="s" x="736" y="418">or the fatal signal</text>
  <rect class="alt" x="520" y="428" width="196" height="38" rx="7"/>
  <text class="h" x="532" y="444">pull: paths</text>
  <text class="s" x="532" y="460">copied back on exit 0</text>
  <rect class="alt" x="724" y="428" width="196" height="38" rx="7"/>
  <text class="h" x="736" y="444">artifacts:</text>
  <text class="s" x="736" y="460">copied back on failure</text>
  <rect class="warn" x="520" y="470" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="486">refused by magic bytes</text>
  <text class="s" x="532" y="502">native binaries never come back; pull: refuses archives too</text>
  <rect class="alt" x="40" y="386" width="400" height="38" rx="7"/>
  <text class="h" x="52" y="402">the caller</text>
  <text class="s" x="52" y="418">same output and exit code as a local run</text>
  <rect class="chip" x="40" y="428" width="400" height="38" rx="7"/>
  <text class="h" x="52" y="444">working tree</text>
  <text class="s" x="52" y="460">pull: files land in place</text>
  <rect class="chip" x="40" y="470" width="400" height="38" rx="7"/>
  <text class="h" x="52" y="486">run record</text>
  <text class="s" x="52" y="502">output.log, and artifacts/ outside the project tree</text>
  <path class="ln2" d="M504,426 H456" marker-end="url(#sa-trust-mb)"/>
  <path class="warn" d="M504,489 H486 M486,482 V496"/>

  <!-- the boundary -->
  <path class="seam" d="M480,44 V520"/>
  <path class="seam" d="M40,536 H920"/>
  <text class="s" x="480" y="558" text-anchor="middle">Only the filtered file set, the allowlisted variables and the command line cross; output, the exit code and checked files come back.</text>
</svg>
