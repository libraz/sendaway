<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" width="960" height="472" role="img" aria-labelledby="sa-run-ja-t sa-run-ja-d">
  <title id="sa-run-ja-t">sendaway を通るコマンドの流れ</title>
  <desc id="sa-run-ja-d">左から右へ 3 つの区画が並びます。Mac では、ターミナルで打った、スクリプトが呼んだ、あるいは Claude Code や Codex が実行した make test などのコマンドが、PATH の先頭にある sendaway shim に届き、 shim が .sendaway.yml を読みます。どのルールにも一致しない、local: が優先する、または .sendaway.yml がないときは、本物のバイナリがローカルで動きます。リモートに一致すると、まず Mac 上で送るファイル集合を作ります。追跡中のファイルと無視されていない未追跡ファイルから、秘密らしいファイルと exclude: のパスを除いたものです。Linux のビルドホストでは、ssh で起動した remote-exec がプロジェクト単位のロックを取り、ローカルで消したファイルを削除します。続いて rsync がツリーと .git を一方向に同じ絶対パスへ送り、ホスト側の無視対象パスはそのまま残します。prepare は when: のファイルが変わったときだけ動き、コマンドはログインシェル経由で専用のプロセスグループで、許可リストから組み直した環境で実行されます。実行中は出力フレームが、終了後は終了コードと回収したファイルが戻ります。exit 0 なら pull: のパス、失敗なら artifacts: のパスを回収し、ネイティブバイナリは拒否します。Mac から見た出力と終了コードはローカル実行と同じで、実行は手元に記録され、sendaway last で読み返せます。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .hm    { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px }
    rect.warn { fill:#ffffff; stroke-width:1 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
      rect.warn{fill:#161b22}
    }
  </style>

  <defs>
    <marker id="sa-run-ja-ma" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-run-ja-mb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="472" rx="12"/>

  <!-- panels -->
  <rect class="grp" x="24" y="40" width="288" height="378" rx="10"/>
  <rect class="grp" x="336" y="40" width="288" height="174" rx="10"/>
  <rect class="grp" x="648" y="40" width="288" height="378" rx="10"/>
  <text class="lbl" x="40" y="62">Mac</text>
  <text class="lbl" x="352" y="62">送る前に Mac で</text>
  <text class="lbl" x="664" y="62">ビルドホスト（Linux）</text>

  <!-- connectors, drawn under the boxes -->
  <path class="ln" d="M168,130 V144" marker-end="url(#sa-run-ja-ma)"/>
  <path class="ln" d="M168,198 V212" marker-end="url(#sa-run-ja-ma)"/>
  <text class="s" x="176" y="208">ローカル</text>
  <path class="ln2" d="M168,348 V334" marker-end="url(#sa-run-ja-mb)"/>
  <path class="ln" d="M296,171 H324 V103 H352" marker-end="url(#sa-run-ja-ma)"/>
  <path class="ln" d="M480,130 V144" marker-end="url(#sa-run-ja-ma)"/>
  <path class="ln" d="M608,171 H636 V103 H664" marker-end="url(#sa-run-ja-ma)"/>
  <path class="ln" d="M792,130 V144" marker-end="url(#sa-run-ja-ma)"/>
  <path class="ln" d="M792,198 V212" marker-end="url(#sa-run-ja-ma)"/>
  <path class="ln" d="M792,266 V280" marker-end="url(#sa-run-ja-ma)"/>
  <path class="ln2" d="M792,334 V348" marker-end="url(#sa-run-ja-mb)"/>
  <path class="ln2" d="M664,375 H296" marker-end="url(#sa-run-ja-mb)"/>
  <text class="s" x="480" y="367" text-anchor="middle">実行中は出力フレームを順に</text>
  <text class="s" x="480" y="390" text-anchor="middle">終了後に終了コードと回収したファイル</text>

  <!-- Mac -->
  <rect class="chip" x="40" y="76" width="256" height="54" rx="7"/>
  <text class="hm" x="52" y="96">make test</text>
  <text class="s" x="52" y="112">ターミナル、スクリプト、</text>
  <text class="s" x="52" y="125">Claude Code、Codex から</text>
  <rect class="card" x="40" y="144" width="256" height="54" rx="7"/>
  <text class="lbl" x="50" y="164">1</text>
  <text class="h" x="66" y="164">sendaway shim</text>
  <text class="s" x="66" y="180">PATH の先頭で .sendaway.yml を読む</text>
  <text class="s" x="66" y="193">remote: に一致し local: に不一致なら</text>
  <rect class="chip" x="40" y="212" width="256" height="54" rx="7"/>
  <text class="h" x="52" y="232">本物のバイナリをローカルで</text>
  <text class="s" x="52" y="248">どのルールにも一致しない、local: が</text>
  <text class="s" x="52" y="261">優先する、.sendaway.yml がないとき</text>
  <rect class="chip" x="40" y="280" width="256" height="54" rx="7"/>
  <text class="h" x="52" y="300">実行記録</text>
  <text class="s" x="52" y="316">出力と meta.json を手元に残す。</text>
  <text class="s" x="52" y="329">sendaway last で読み返せる</text>
  <rect class="alt" x="40" y="348" width="256" height="54" rx="7"/>
  <text class="lbl" x="50" y="368">9</text>
  <text class="h" x="66" y="368">ローカル実行と同じ結果</text>
  <text class="s" x="66" y="384">stdout と stderr、続いて終了コード</text>
  <text class="s" x="66" y="397">または同じシグナルで終了</text>

  <!-- before sending -->
  <rect class="card" x="352" y="76" width="256" height="54" rx="7"/>
  <text class="lbl" x="362" y="96">2</text>
  <text class="h" x="378" y="96">git が決めるファイル集合</text>
  <text class="s" x="378" y="112">追跡中のファイルと、</text>
  <text class="s" x="378" y="125">無視されていない未追跡ファイル</text>
  <rect class="warn" x="352" y="144" width="256" height="54" rx="7"/>
  <text class="lbl" x="362" y="164">3</text>
  <text class="h" x="378" y="164">秘密ファイルの除外</text>
  <text class="s" x="378" y="180">.env・鍵・トークン入り .npmrc と</text>
  <text class="s" x="378" y="193">exclude: のパスは送らない</text>

  <!-- build host -->
  <rect class="card" x="664" y="76" width="256" height="54" rx="7"/>
  <text class="lbl" x="674" y="96">4</text>
  <text class="h" x="690" y="96">remote-exec</text>
  <text class="s" x="690" y="112">ssh で起動し、プロジェクトのロックを取る</text>
  <text class="s" x="690" y="125">ローカルで消したファイルを削除</text>
  <rect class="card" x="664" y="144" width="256" height="54" rx="7"/>
  <text class="lbl" x="674" y="164">5</text>
  <text class="h" x="690" y="164">push：rsync（一方向）</text>
  <text class="s" x="690" y="180">ツリーと .git を同じ絶対パスへ</text>
  <text class="s" x="690" y="193">ホスト側の無視対象パスは残す</text>
  <rect class="card" x="664" y="212" width="256" height="54" rx="7"/>
  <text class="lbl" x="674" y="232">6</text>
  <text class="h" x="690" y="232">prepare</text>
  <text class="s" x="690" y="248">when: のファイルが変わったときだけ</text>
  <text class="s" x="690" y="261">実行（yarn.lock など）</text>
  <rect class="card" x="664" y="280" width="256" height="54" rx="7"/>
  <text class="lbl" x="674" y="300">7</text>
  <text class="h" x="690" y="300">コマンド本体</text>
  <text class="s" x="690" y="316">ログインシェル、専用のプロセスグループ</text>
  <text class="s" x="690" y="329">環境は許可リストから組み直す</text>
  <rect class="alt" x="664" y="348" width="256" height="54" rx="7"/>
  <text class="lbl" x="674" y="368">8</text>
  <text class="h" x="690" y="368">ファイルの回収</text>
  <text class="s" x="690" y="384">pull:（exit 0）と artifacts:（失敗時）</text>
  <text class="s" x="690" y="397">ネイティブバイナリは拒否</text>

  <path class="seam" d="M40,434 H920"/>
  <text class="s" x="480" y="456" text-anchor="middle">Mac から見た出力と終了コードはローカル実行と同じ。送るのはフィルタ後のファイル集合だけで、ネイティブバイナリは戻らない。</text>
</svg>
