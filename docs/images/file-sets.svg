<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="sa-fs-t sa-fs-d">
  <title id="sa-fs-t">The three file sets built with git, and what each becomes on the host</title>
  <desc id="sa-fs-d">On the workstation, git splits the working tree into three sets. The manifest holds tracked files plus untracked files git does not ignore, sorted. The secret set is carved out of the manifest: files matched by the name rules, an .npmrc or .yarnrc.yml holding a token, and exclude: entries. The ignored set holds the untracked paths git ignores. One rsync, anchored at the root, sends the manifest minus the secret set to the same absolute path on the build host; before it, the host deletes files the previous run sent and this one does not. Secret files never arrive and are listed on stderr; ignored paths are never sent and the host leaves its own copies alone, so build directories survive between runs. A second rsync runs in parallel for .git, deleting stale files but never touching config, FETCH_HEAD, hooks/, logs/, *.lock or objects/tmp_*, and the host writes a minimal .git/config with no remotes. A git submodule, a nested repository or a file name not stored in NFC fails the run with exit 125 before anything is sent.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    .s.warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .code  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .s.warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="sa-fs-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-fs-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="410" rx="12"/>
  <text class="lbl" x="24" y="30">workstation: git builds the sets, then two rsyncs</text>
  <text class="lbl" x="672" y="30">build host: same absolute path</text>
  <path class="seam" d="M660,18 V372"/>
  <path class="ln" d="M156,80 H178" marker-end="url(#sa-fs-a)"/>
  <path class="ln" d="M156,196 H168 V332 H178" marker-end="url(#sa-fs-a)"/>
  <path class="ln" d="M168,254 H178" marker-end="url(#sa-fs-a)"/>
  <path class="ln" d="M215,118 V134" marker-end="url(#sa-fs-a)"/>
  <text class="s" x="223" y="130">withheld</text>
  <path class="ln" d="M430,80 H450" marker-end="url(#sa-fs-a)"/>
  <path class="ln2" d="M648,80 H670" marker-end="url(#sa-fs-b)"/>
  <path class="ln2" d="M648,332 H670" marker-end="url(#sa-fs-b)"/>

  <rect class="chip" x="24" y="42" width="132" height="170" rx="7"/>
  <text class="h" x="34" y="61">working tree</text>
  <text class="s" x="34" y="77">the project root at</text>
  <text class="s" x="34" y="91">the git top level,</text>
  <text class="s" x="34" y="105">.git a directory</text>
  <text class="s" x="34" y="119">(worktrees refused)</text>
  <rect class="chip" x="24" y="226" width="132" height="142" rx="7"/>
  <rect class="warn" x="24" y="226" width="132" height="142" rx="7"/>
  <text class="h" x="34" y="245">manifest fails</text>
  <text class="s" x="34" y="261">on a git submodule,</text>
  <text class="s" x="34" y="275">a nested repository</text>
  <text class="s" x="34" y="289">or a file name not</text>
  <text class="s" x="34" y="303">stored in NFC:</text>
  <text class="warnt s" x="34" y="317">exit 125, nothing</text>
  <text class="warnt s" x="34" y="331">is sent</text>
  <rect class="card" x="180" y="42" width="250" height="76" rx="7"/>
  <text class="lbl" x="190" y="61">1</text>
  <text class="h" x="204" y="61">manifest</text>
  <text class="s" x="190" y="77">tracked files, plus untracked files</text>
  <text class="s" x="190" y="91">git does not ignore; sorted</text>
  <text class="s" x="190" y="105">locally deleted files are not in it</text>
  <rect class="chip" x="180" y="136" width="250" height="76" rx="7"/>
  <rect class="warn" x="180" y="136" width="250" height="76" rx="7"/>
  <text class="lbl" x="190" y="155">2</text>
  <text class="h" x="204" y="155">secret set</text>
  <text class="s" x="190" y="171">name rules: .env, *.key, id_rsa*, …</text>
  <text class="s" x="190" y="185">.npmrc / .yarnrc.yml holding a token</text>
  <text class="s" x="190" y="199">exclude: entries</text>
  <rect class="chip" x="180" y="226" width="250" height="56" rx="7"/>
  <text class="lbl" x="190" y="245">3</text>
  <text class="h" x="204" y="245">ignored set</text>
  <text class="s" x="190" y="261">untracked paths git ignores</text>
  <rect class="chip" x="180" y="296" width="250" height="72" rx="7"/>
  <text class="h" x="190" y="315">.git directory</text>
  <text class="s" x="190" y="331">the repository itself, synced</text>
  <text class="s" x="190" y="345">apart from the tree</text>
  <rect class="alt" x="452" y="42" width="196" height="76" rx="7"/>
  <text class="h" x="462" y="61">rsync: tree</text>
  <text class="s" x="462" y="77">the manifest minus the secret set</text>
  <text class="s" x="462" y="91">anchored at the root; ignored,</text>
  <text class="s" x="462" y="105">secret and exclude: skipped</text>
  <text class="warnt s" x="452" y="155">never sent</text>
  <text class="s" x="452" y="171">each file is listed on stderr:</text>
  <text class="code" x="452" y="185">not sent (secret-like): …</text>
  <text class="warnt s" x="452" y="245">never sent</text>
  <text class="s" x="452" y="261">and not listed</text>
  <rect class="alt" x="452" y="296" width="196" height="72" rx="7"/>
  <text class="h" x="462" y="315">rsync: .git, in parallel</text>
  <text class="s" x="462" y="331">deletes stale files, except</text>
  <text class="code" x="462" y="345">config FETCH_HEAD hooks/</text>
  <text class="code" x="462" y="359">logs/ *.lock objects/tmp_*</text>
  <rect class="alt" x="672" y="42" width="264" height="76" rx="7"/>
  <text class="h" x="682" y="61">sent files</text>
  <text class="s" x="682" y="77">written at the same absolute path;</text>
  <text class="s" x="682" y="91">before the push, files the previous</text>
  <text class="s" x="682" y="105">run sent and this one does not are deleted</text>
  <rect class="chip" x="672" y="136" width="264" height="76" rx="7"/>
  <text class="h" x="682" y="155">withheld files</text>
  <text class="s" x="682" y="171">never arrive; one a previous run sent</text>
  <text class="s" x="682" y="185">is deleted like any dropped file</text>
  <rect class="chip" x="672" y="226" width="264" height="56" rx="7"/>
  <text class="h" x="682" y="245">ignored paths</text>
  <text class="s" x="682" y="261">host copies left alone, so build dirs</text>
  <text class="s" x="682" y="275">survive between runs</text>
  <rect class="alt" x="672" y="296" width="264" height="72" rx="7"/>
  <text class="h" x="682" y="315">.git</text>
  <text class="s" x="682" y="331">stale files removed, the rest updated</text>
  <text class="s" x="682" y="345">then a minimal .git/config is written:</text>
  <text class="s" x="682" y="359">no remotes, URLs or credential helpers</text>

  <text class="s" x="480" y="394" text-anchor="middle">git decides membership, so negation patterns, .git/info/exclude and core.excludesFile apply exactly as they do for git.</text>
</svg>
