<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 578" width="960" height="578" role="img" aria-labelledby="sa-trust-ja-t sa-trust-ja-d">
  <title id="sa-trust-ja-t">ビルドホストへ渡るもの、渡らないもの</title>
  <desc id="sa-trust-ja-d">左が Mac、右がビルドホストで、間の縦の破線が境界。ホストへ送るのは、git が列挙するソースファイル、.git の objects・refs・index、許可リストの環境変数と env: に挙げた名前、argv。これらはホスト上で、同じ絶対パスの作業ツリーとコマンドの環境になる。送らないのは、.env・鍵・トークン入りの .npmrc などの秘密らしいファイル、リモート URL にトークンを含みうる .git/config、FETCH_HEAD・hooks・logs、秘密らしい名前の環境変数、sshd が受け入れる LANG と LC_*、ssh のエージェント・X11・ポート転送。ホスト側では子プロセスの環境を一から組み立て、ssh の引数で転送を無効にし、.git/config はリモートを持たない形で書き直す。戻ってくるのは、順序を保ったフレームとしての stdout と stderr、終了コードまたはシグナル、exit 0 のときの pull: のパス、失敗時の artifacts:。マジックバイトが ELF・Mach-O・PE・ar・アーカイブを示すファイルは境界を越える前に拒否する。</desc>

  <style>
    .bg   { fill:#f6f7f9 }
    .grp  { fill:#eceef2 }
    .chip { fill:#ffffff; stroke:#d5d9e0 }
    .card { fill:#ffffff; stroke:#2b6cb0 }
    .alt  { fill:#ffffff; stroke:#2a7f6f }
    rect.warn { fill:#ffffff; stroke:#a3401f }
    path.warn { fill:none; stroke:#a3401f; stroke-width:1.4 }
    .rule { fill:none; stroke:#c3c8d0; stroke-width:1 }
    .seam { fill:none; stroke:#c3c8d0; stroke-dasharray:6 5 }
    .ln   { fill:none; stroke:#2b6cb0; stroke-width:1.4 }
    .ah   { fill:#2b6cb0 }
    .ln2  { fill:none; stroke:#2a7f6f; stroke-width:1.4 }
    .ah2  { fill:#2a7f6f }
    .lnd  { fill:none; stroke:#2b6cb0; stroke-width:1.2; stroke-dasharray:4 3 }
    text  { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h    { font-size:12.5px }
    .hb   { font-size:12.5px; font-weight:600 }
    .lbl  { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s    { font-size:10.5px; fill:#6e7781 }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#2b6cb0 }
    .hm   { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px }
    .code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px }
    .warnt { fill:#a3401f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#7fb3d5} .alt{fill:#161b22;stroke:#6fc2ae}
      rect.warn{fill:#161b22;stroke:#e08a68} path.warn{stroke:#e08a68}
      .rule{stroke:#484f58} .seam{stroke:#484f58}
      .ln{stroke:#7fb3d5} .ah{fill:#7fb3d5} .ln2{stroke:#6fc2ae} .ah2{fill:#6fc2ae} .lnd{stroke:#7fb3d5}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e} .mono{fill:#7fb3d5} .warnt{fill:#e08a68}
    }
  </style>
  <defs>
    <marker id="sa-trust-ja-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-trust-ja-a2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="578" rx="12"/>
  <text class="hb" x="240.0" y="34" text-anchor="middle">Mac</text>
  <text class="hb" x="720.0" y="34" text-anchor="middle">ビルドホスト</text>
  <text class="lbl" x="480" y="34" text-anchor="middle">境界</text>

  <!-- band: sent -->
  <rect class="grp" x="24" y="52" width="432" height="120" rx="10"/>
  <rect class="grp" x="504" y="52" width="432" height="120" rx="10"/>
  <text class="lbl" x="40" y="70">ホストへ送るもの</text>
  <text class="lbl" x="520" y="70">ホスト側での形</text>
  <rect class="card" x="40" y="80" width="196" height="38" rx="7"/>
  <text class="h" x="52" y="96">ソースファイル</text>
  <text class="s" x="52" y="112">git が列挙するものだけ</text>
  <rect class="card" x="244" y="80" width="196" height="38" rx="7"/>
  <text class="h" x="256" y="96">.git の中身</text>
  <text class="s" x="256" y="112">objects・refs・index</text>
  <rect class="card" x="40" y="122" width="196" height="38" rx="7"/>
  <text class="h" x="52" y="138">環境変数</text>
  <text class="s" x="52" y="154">許可リストと env: の名前</text>
  <rect class="card" x="244" y="122" width="196" height="38" rx="7"/>
  <text class="h" x="256" y="138">argv</text>
  <text class="s" x="256" y="154">渡されたコマンドライン</text>
  <rect class="chip" x="520" y="80" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="96">作業ツリーの写し</text>
  <text class="s" x="532" y="112">Mac と同じ絶対パスに置く</text>
  <rect class="chip" x="520" y="122" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="138">コマンドの環境</text>
  <text class="s" x="532" y="154">転送された名前だけ</text>
  <path class="ln" d="M456,120 H504" marker-end="url(#sa-trust-ja-a)"/>

  <!-- band: never sent -->
  <rect class="grp" x="24" y="184" width="432" height="162" rx="10"/>
  <rect class="grp" x="504" y="184" width="432" height="162" rx="10"/>
  <text class="lbl warnt" x="40" y="202">送らないもの</text>
  <text class="lbl" x="520" y="202">ホスト側でも塞ぐ</text>
  <rect class="warn" x="40" y="212" width="196" height="38" rx="7"/>
  <text class="h" x="52" y="228">秘密らしいファイル</text>
  <text class="s" x="52" y="244">.env・鍵・トークン入り .npmrc</text>
  <rect class="warn" x="244" y="212" width="196" height="38" rx="7"/>
  <text class="h" x="256" y="228">.git/config</text>
  <text class="s" x="256" y="244">リモート URL にトークン</text>
  <rect class="warn" x="40" y="254" width="196" height="38" rx="7"/>
  <text class="h" x="52" y="270">その他の .git</text>
  <text class="s" x="52" y="286">FETCH_HEAD・hooks・logs</text>
  <rect class="warn" x="244" y="254" width="196" height="38" rx="7"/>
  <text class="h" x="256" y="270">秘密らしい名前の変数</text>
  <text class="s" x="256" y="286">TOKEN・SECRET・AWS_ など</text>
  <rect class="warn" x="40" y="296" width="196" height="38" rx="7"/>
  <text class="h" x="52" y="312">LANG、LC_*</text>
  <text class="s" x="52" y="328">sshd が受け入れる設定でも</text>
  <rect class="warn" x="244" y="296" width="196" height="38" rx="7"/>
  <text class="h" x="256" y="312">エージェント・X11・転送</text>
  <text class="s" x="256" y="328">転送は一切開かない</text>
  <rect class="chip" x="520" y="212" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="228">子プロセスの環境</text>
  <text class="s" x="532" y="244">sshd から継がず、一から組み立てる</text>
  <rect class="chip" x="520" y="254" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="270">ssh の引数</text>
  <text class="s" x="532" y="286">ForwardAgent=no, ForwardX11=no, ClearAllForwardings=yes</text>
  <rect class="chip" x="520" y="296" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="312">ホスト側の .git/config</text>
  <text class="s" x="532" y="328">リモートを持たない形で書き直す</text>
  <path class="warn" d="M456,273 H474 M474,266 V280"/>

  <!-- band: comes back -->
  <rect class="grp" x="24" y="358" width="432" height="162" rx="10"/>
  <rect class="grp" x="504" y="358" width="432" height="162" rx="10"/>
  <text class="lbl" x="40" y="376">戻ってくるもの</text>
  <text class="lbl" x="520" y="376">送り返すもの</text>
  <rect class="alt" x="520" y="386" width="196" height="38" rx="7"/>
  <text class="h" x="532" y="402">stdout、stderr</text>
  <text class="s" x="532" y="418">フレーム化、順序を保つ</text>
  <rect class="alt" x="724" y="386" width="196" height="38" rx="7"/>
  <text class="h" x="736" y="402">終了コード</text>
  <text class="s" x="736" y="418">またはシグナルによる終了</text>
  <rect class="alt" x="520" y="428" width="196" height="38" rx="7"/>
  <text class="h" x="532" y="444">pull: のパス</text>
  <text class="s" x="532" y="460">exit 0 のとき持ち帰る</text>
  <rect class="alt" x="724" y="428" width="196" height="38" rx="7"/>
  <text class="h" x="736" y="444">artifacts:</text>
  <text class="s" x="736" y="460">失敗したとき持ち帰る</text>
  <rect class="warn" x="520" y="470" width="400" height="38" rx="7"/>
  <text class="h" x="532" y="486">マジックバイトで拒否</text>
  <text class="s" x="532" y="502">ELF・Mach-O・PE・ar・アーカイブは戻さない</text>
  <rect class="alt" x="40" y="386" width="400" height="38" rx="7"/>
  <text class="h" x="52" y="402">呼び出し元</text>
  <text class="s" x="52" y="418">ローカル実行と同じ出力と終了コード</text>
  <rect class="chip" x="40" y="428" width="400" height="38" rx="7"/>
  <text class="h" x="52" y="444">作業ツリー</text>
  <text class="s" x="52" y="460">持ち帰ったファイルがその場に入る</text>
  <path class="ln2" d="M504,426 H456" marker-end="url(#sa-trust-ja-a2)"/>
  <path class="warn" d="M504,489 H486 M486,482 V496"/>

  <!-- the boundary -->
  <path class="seam" d="M480,44 V520"/>
  <path class="seam" d="M40,536 H920"/>
  <text class="s" x="480.0" y="558" text-anchor="middle">境界を越えるのは git が列挙するもの・許可した変数・argv だけ。戻るのは出力・終了コード・検査済みのファイル。</text>
</svg>
