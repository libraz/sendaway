<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="sa-hlja-t sa-hlja-d">
  <title id="sa-hlja-t">ビルドホストでのコマンドの起動</title>
  <desc id="sa-hlja-d">左に Mac、右にビルドホストの 2 つの領域があります。Mac の /Users/alice/Projects/app にあるプロジェクトは、ホストでも同じ絶対パスに置かれ、親の /Users/alice はビルド用ユーザーが所有しています。ホストのシェルが起動時に持つ環境変数はゼロから組み立てられ、3 つの部分からなります。1 つ目は転送する変数で、許可リストと、env: に挙げた名前のうちローカルで設定されているものから、秘密らしい名前と /opt/homebrew のような Mac 固有の値を Mac 側で除いたものです。2 つ目はホストの ssh セッションにある HOME、USER、LOGNAME、SHELL、PATH、3 つ目は SENDAWAY_PASSTHROUGH=1 です。これ以外は LANG や LC_* も含めて渡りません。コマンドは $SHELL -lc &apos;exec env -- &quot;$@&quot;&apos; sendaway NAME=value … cmd args の形で起動され、rc とプロファイルのファイルは標準出力に何も出してはいけません。その後の 3 段階は次のとおりです。まずログインプロファイルが読まれてツールチェーンを PATH に通し、次に env が転送した値をプロファイルの設定の上に適用し、最後にコマンドが専用のプロセスグループで、stdin を /dev/null とし端末なしで実行されます。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    rect.warn { fill:#ffffff }
    .warnt, text.warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .code  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} rect.warn{fill:#161b22} .warnt,text.warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="sa-hlja-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-hlja-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-hlja-w" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="warnt" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="420" rx="12"/>

  <!-- panels -->
  <rect class="grp" x="24" y="36" width="268" height="284" rx="10"/>
  <rect class="grp" x="316" y="36" width="620" height="344" rx="10"/>
  <text class="lbl" x="40" y="58">Mac</text>
  <text class="lbl" x="332" y="58">ビルドホスト (Linux)</text>

  <!-- connectors, drawn under the boxes -->
  <path class="ln" d="M276,91 H330" marker-end="url(#sa-hlja-a)"/>
  <path class="warn" d="M158,216 V242" marker-end="url(#sa-hlja-w)"/>
  <path class="ln2" d="M626,226 V240" marker-end="url(#sa-hlja-b)"/>
  <path class="ln" d="M424,288 V302" marker-end="url(#sa-hlja-a)"/>
  <path class="ln" d="M516,334 H532" marker-end="url(#sa-hlja-a)"/>
  <path class="ln" d="M718,334 H734" marker-end="url(#sa-hlja-a)"/>

  <!-- Mac -->
  <rect class="chip" x="40" y="68" width="236" height="46" rx="7"/>
  <text class="h" x="52" y="86">Mac 上のプロジェクト</text>
  <text class="code" x="52" y="103">/Users/alice/Projects/app</text>

  <rect class="chip" x="40" y="156" width="236" height="60" rx="7"/>
  <text class="h" x="52" y="174">ローカルの環境変数</text>
  <text class="s" x="52" y="190">許可リストと、env: の名前のうち</text>
  <text class="s" x="52" y="204">ローカルで設定されているもの</text>

  <rect class="warn" x="40" y="244" width="236" height="60" rx="7"/>
  <text class="h warnt" x="52" y="262">送信前に除外</text>
  <text class="s" x="52" y="278">秘密らしい名前: TOKEN, AWS_ …</text>
  <text class="s" x="52" y="292">Mac のパス: /opt/homebrew, /Library/ …</text>

  <!-- build host -->
  <rect class="card" x="332" y="68" width="588" height="46" rx="7"/>
  <text class="code" x="346" y="86">/Users/alice/Projects/app</text>
  <text class="s" x="346" y="103">同じ絶対パス。親の /Users/alice はビルド用ユーザーが所有</text>

  <rect class="alt" x="332" y="130" width="588" height="96" rx="7"/>
  <text class="lbl" x="346" y="148">シェルが起動時に持つ環境変数。ゼロから組み立てる</text>
  <text class="s" x="906" y="148" text-anchor="end">これ以外は渡らない。LANG や LC_* も同様</text>
  <path class="ln2" d="M276,186 H342" marker-end="url(#sa-hlja-b)"/>
  <rect class="chip" x="344" y="156" width="184" height="60" rx="5"/>
  <text class="h" x="356" y="174">転送する変数</text>
  <text class="s" x="356" y="190">Mac から、除外を経て</text>
  <text class="code" x="356" y="204">MAKEFLAGS GOFLAGS CI …</text>
  <rect class="chip" x="536" y="156" width="184" height="60" rx="5"/>
  <text class="h" x="548" y="174">ホストの ssh セッション</text>
  <text class="code" x="548" y="190">HOME USER LOGNAME</text>
  <text class="code" x="548" y="204">SHELL PATH</text>
  <rect class="chip" x="728" y="156" width="184" height="60" rx="5"/>
  <text class="h" x="740" y="174">常に追加</text>
  <text class="code" x="740" y="190">SENDAWAY_PASSTHROUGH=1</text>

  <rect class="card" x="332" y="242" width="588" height="46" rx="7"/>
  <text class="mono" x="346" y="261">$SHELL -lc 'exec env -- "$@"' sendaway NAME=value … cmd args</text>
  <text class="s warnt" x="346" y="278">rc とプロファイルのファイルは標準出力に何も出さないこと</text>

  <rect class="card" x="332" y="304" width="184" height="60" rx="7"/>
  <text class="lbl" x="342" y="324">1</text>
  <text class="h" x="358" y="324">ログインプロファイル</text>
  <text class="s" x="358" y="340">最初に読まれ、</text>
  <text class="s" x="358" y="353">ツールチェーンを PATH へ</text>
  <rect class="card" x="534" y="304" width="184" height="60" rx="7"/>
  <text class="lbl" x="544" y="324">2</text>
  <text class="h" x="560" y="324">転送した値が勝つ</text>
  <text class="s" x="560" y="340">env が NAME=value を</text>
  <text class="s" x="560" y="353">プロファイルの値の上に設定</text>
  <rect class="card" x="736" y="304" width="184" height="60" rx="7"/>
  <text class="lbl" x="746" y="324">3</text>
  <text class="h" x="762" y="324">コマンド本体</text>
  <text class="s" x="762" y="340">専用のプロセスグループ</text>
  <text class="s" x="762" y="353">stdin は /dev/null、tty なし</text>

  <text class="s" x="480" y="404" text-anchor="middle">どちらのマシンからも、これ以外の変数は渡らない。コマンドに見えるそれ以外の変数は、ホストのログインシェルとプロファイルが設定したもの。</text>
</svg>
