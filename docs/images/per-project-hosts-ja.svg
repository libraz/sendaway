<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="sa-hosts-ja-t sa-hosts-ja-d">
  <title id="sa-hosts-ja-t">プロジェクトごとに別のビルドホストへ振り分ける</title>
  <desc id="sa-hosts-ja-d">Mac 上の 3 つのプロジェクトが 2 台のビルドホストに対応します。~/Projects/big-repo は経路に一致して build02 へ行きます。~/Projects/foobar と ~/Projects/web はどの経路にも一致せず、既定のホスト build01 へ行きます。パスはパス要素単位で比べるので、~/Projects/foo の経路は ~/Projects/foobar を含みません。下段はこれを決める 2 つの dotfiles です。~/.config/sendaway/config.yml が既定のホストと経路を持ち、パス要素単位の最長一致が勝ちます。~/.ssh/config は各ホストのアドレス・ユーザー・鍵を持ち、ssh_config: で別のファイルを指定することもできます。ホストはこれらの dotfiles に置き、どのリポジトリにも入れないので、プロジェクトの .sendaway.yml はホストを選べません。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .hb    { font-size:12.5px; font-weight:600 }
    .hm    { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px }
    .code  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px }
    .lnd   { fill:none; stroke:#6e7781; stroke-width:1.2; stroke-dasharray:4 3 }
    .ahd   { fill:#6e7781 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
      .lnd{stroke:#8b949e} .ahd{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="sa-hosts-ja-ma" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-hosts-ja-mb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-hosts-ja-md" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ahd" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="460" rx="12"/>

  <!-- panels -->
  <rect class="grp" x="24" y="36" width="300" height="168" rx="10"/>
  <rect class="grp" x="636" y="36" width="300" height="168" rx="10"/>
  <text class="lbl" x="40" y="56">Mac 上のプロジェクト</text>
  <text class="lbl" x="652" y="56">ビルドホスト</text>

  <!-- connectors -->
  <path class="ln" d="M308,84 H652" marker-end="url(#sa-hosts-ja-ma)"/>
  <path class="ln2" d="M308,128 H652" marker-end="url(#sa-hosts-ja-mb)"/>
  <path class="ln2" d="M308,172 H652" marker-end="url(#sa-hosts-ja-mb)"/>
  <text class="s" x="480" y="78" text-anchor="middle">経路：~/Projects/big-repo</text>
  <text class="s" x="480" y="122" text-anchor="middle">経路なし：…/foo は …/foobar を含まない</text>
  <text class="s" x="480" y="166" text-anchor="middle">一致する経路なし</text>

  <!-- projects -->
  <rect class="chip" x="40" y="68" width="268" height="32" rx="7"/>
  <text class="hm" x="52" y="88">~/Projects/big-repo</text>
  <rect class="chip" x="40" y="112" width="268" height="32" rx="7"/>
  <text class="hm" x="52" y="132">~/Projects/foobar</text>
  <rect class="chip" x="40" y="156" width="268" height="32" rx="7"/>
  <text class="hm" x="52" y="176">~/Projects/web</text>

  <!-- hosts -->
  <rect class="card" x="652" y="62" width="268" height="44" rx="7"/>
  <text class="hb" x="664" y="80">build02</text>
  <text class="s" x="664" y="96">一致した経路が指すホスト</text>
  <rect class="alt" x="652" y="112" width="268" height="76" rx="7"/>
  <text class="hb" x="664" y="140">build01</text>
  <text class="s" x="664" y="157">既定のホスト（host: の値）</text>
  <text class="s" x="664" y="170">どの経路にも一致しないときに使う</text>

  <!-- dotfiles -->
  <rect class="grp" x="24" y="220" width="912" height="188" rx="10"/>
  <text class="lbl" x="40" y="240">リポジトリではなく dotfiles に置く</text>
  <rect class="chip" x="40" y="252" width="560" height="140" rx="7"/>
  <text class="hm" x="52" y="272">~/.config/sendaway/config.yml</text>
  <text class="code" x="52" y="292" xml:space="preserve">host: build01</text>
  <text class="s" x="380" y="292"># 既定の ssh エイリアス</text>
  <text class="code" x="52" y="306" xml:space="preserve">routes:</text>
  <text class="s" x="380" y="306"># パス要素単位の最長一致が勝つ</text>
  <text class="code" x="52" y="320" xml:space="preserve">  - path: ~/Projects/big-repo</text>
  <text class="code" x="52" y="334" xml:space="preserve">    host: build02</text>
  <text class="code" x="52" y="348" xml:space="preserve">  - path: ~/Projects/foo</text>
  <text class="code" x="52" y="362" xml:space="preserve">    host: build02</text>
  <text class="s" x="52" y="380">~/Projects/foo は ~/Projects/foo/api に一致し、~/Projects/foobar には一致しない</text>
  <rect class="chip" x="652" y="252" width="268" height="140" rx="7"/>
  <text class="hm" x="664" y="272">~/.ssh/config</text>
  <text class="s" x="664" y="292">Host build01、Host build02 に</text>
  <text class="s" x="664" y="305">アドレス・ユーザー・鍵を書く</text>
  <text class="s" x="664" y="331">config.yml の ssh_config: で</text>
  <text class="s" x="664" y="344">別のファイルを -F として渡せる</text>
  <text class="s" x="664" y="370">どちらのファイルも鍵も</text>
  <text class="s" x="664" y="383">Mac の外には出ない</text>
  <path class="lnd" d="M786,252 V206" marker-end="url(#sa-hosts-ja-md)"/>
  <text class="s" x="794" y="236">ssh が各エイリアスを解決</text>

  <path class="seam" d="M40,424 H920"/>
  <text class="s" x="480" y="446" text-anchor="middle">ホストは dotfiles に置き、どのリポジトリにも入れない。プロジェクトの .sendaway.yml はホストを選べない。</text>
</svg>
