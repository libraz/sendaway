<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" role="img" aria-labelledby="sa-out-ja-t sa-out-ja-d">
  <title id="sa-out-ja-t">実行が終わりうる場所と、呼び出し側が受け取る終了ステータス</title>
  <desc id="sa-out-ja-d">実行の6つの段階を左から右に並べています。設定と検査、ホストが hello を返すまでの ssh 接続、 push が終わるまでの同期、prepare、ビルドホストでのコマンド、結果の回収です。各段階の下に、そこで失敗したときの結果を示します。設定や事前条件の誤りは 125 で終わります。ホストに到達できない（DNS、タイムアウト、接続拒否、経路なし）ときはコマンドを nice 10 で手元実行し、手元の終了コードを返します。認証やホスト鍵の失敗は ssh のメッセージのまま 125 で終わり、フォールバックしません。同期の失敗と prepare コマンドの失敗も 125 です。コマンド自身の終了コード N はそのまま返り、トレーラーに exit N と出ます。シグナルで死んだコマンドの場合、 shim も同じシグナルで終わります。exit 0 の後に pull が拒否または失敗すると 125 です。同期中に接続が切れると「何も実行されていない」として 125、 push の後に切れると「結果は不明」として 125 で終わります。トレーラーのない 125 は sendaway の失敗を表し、コマンド自身が 125 で終わった場合はトレーラーが出ます。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .hb    { font-size:12.5px; font-weight:600 }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .code  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; fill:#1f2328 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e} .code{fill:#e6edf3}
    }
  </style>

  <defs>
    <marker id="sa-out-ja-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="384" rx="12"/>

  <!-- condition bands -->
  <rect class="grp" x="14" y="92" width="932" height="140" rx="8"/>
  <text class="lbl" x="26" y="108">その段階で失敗・終了したとき</text>
  <rect class="grp" x="14" y="240" width="932" height="84" rx="8"/>
  <text class="lbl" x="26" y="256">接続が切れたとき</text>

  <!-- boundaries: hello (fallback ends) and push done (nothing ran / result unknown) -->
  <path class="seam" d="M356,24 V332"/>
  <path class="seam" d="M484,24 V332"/>
  <text class="lbl" x="356" y="346" text-anchor="middle">hello</text>
  <text class="lbl" x="484" y="346" text-anchor="middle">push 完了</text>

  <!-- phases -->
  <path class="ln" d="M148,54 H163" marker-end="url(#sa-out-ja-a)"/>
  <path class="ln" d="M348,54 H363" marker-end="url(#sa-out-ja-a)"/>
  <path class="ln" d="M476,54 H491" marker-end="url(#sa-out-ja-a)"/>
  <path class="ln" d="M604,54 H619" marker-end="url(#sa-out-ja-a)"/>
  <path class="ln" d="M796,54 H811" marker-end="url(#sa-out-ja-a)"/>
  <rect class="card" x="24" y="28" width="124" height="52" rx="7"/>
  <text class="lbl" x="34" y="48">1</text>
  <text class="h" x="48" y="48">設定と検査</text>
  <text class="s" x="48" y="66">前提条件を確認</text>
  <rect class="card" x="164" y="28" width="184" height="52" rx="7"/>
  <text class="lbl" x="174" y="48">2</text>
  <text class="h" x="188" y="48">接続</text>
  <text class="s" x="188" y="66">ssh、hello まで</text>
  <rect class="card" x="364" y="28" width="112" height="52" rx="7"/>
  <text class="lbl" x="374" y="48">3</text>
  <text class="h" x="388" y="48">同期</text>
  <text class="s" x="388" y="66">push 完了まで</text>
  <rect class="card" x="492" y="28" width="112" height="52" rx="7"/>
  <text class="lbl" x="502" y="48">4</text>
  <text class="h" x="516" y="48">prepare</text>
  <text class="s" x="516" y="66">prepare: の実行</text>
  <rect class="card" x="620" y="28" width="176" height="52" rx="7"/>
  <text class="lbl" x="630" y="48">5</text>
  <text class="h" x="644" y="48">コマンド</text>
  <text class="s" x="644" y="66">ビルドホストで実行</text>
  <rect class="card" x="812" y="28" width="124" height="52" rx="7"/>
  <text class="lbl" x="822" y="48">6</text>
  <text class="h" x="836" y="48">回収</text>
  <text class="s" x="836" y="66">結果を持ち帰る</text>

  <!-- outcomes when the step fails or ends -->
  <rect class="chip" x="24" y="114" width="124" height="52" rx="7"/>
  <rect class="warn" x="24" y="114" width="124" height="52" rx="7"/>
  <text class="hb warnt" x="34" y="132">exit 125</text>
  <text class="s" x="34" y="147">設定の誤り、</text>
  <text class="s" x="34" y="160">事前条件の不成立</text>
  <rect class="alt" x="164" y="114" width="184" height="52" rx="7"/>
  <text class="hb" x="174" y="132">手元で実行</text>
  <text class="s" x="174" y="147">到達不能（DNS、時間切れ等）</text>
  <text class="s" x="174" y="160">nice 10、手元の終了コード</text>
  <rect class="chip" x="164" y="172" width="184" height="52" rx="7"/>
  <rect class="warn" x="164" y="172" width="184" height="52" rx="7"/>
  <text class="hb warnt" x="174" y="190">exit 125</text>
  <text class="s" x="174" y="205">認証・ホスト鍵の失敗：</text>
  <text class="s" x="174" y="218">フォールバックせず ssh の表示</text>
  <rect class="chip" x="364" y="114" width="112" height="52" rx="7"/>
  <rect class="warn" x="364" y="114" width="112" height="52" rx="7"/>
  <text class="hb warnt" x="374" y="132">exit 125</text>
  <text class="s" x="374" y="147">sync failed:</text>
  <text class="s" x="374" y="160">rsync の失敗</text>
  <rect class="chip" x="492" y="114" width="112" height="52" rx="7"/>
  <rect class="warn" x="492" y="114" width="112" height="52" rx="7"/>
  <text class="hb warnt" x="502" y="132">exit 125</text>
  <text class="s" x="502" y="147">prepare: の</text>
  <text class="s" x="502" y="160">コマンドが失敗</text>
  <rect class="alt" x="620" y="114" width="176" height="52" rx="7"/>
  <text class="hb" x="630" y="132">exit N</text>
  <text class="s" x="630" y="147">コマンド自身の終了コード</text>
  <text class="s" x="630" y="160">トレーラーにも表示</text>
  <rect class="alt" x="620" y="172" width="176" height="52" rx="7"/>
  <text class="hb" x="630" y="190">killed by signal N</text>
  <text class="s" x="630" y="205">shim も同じ</text>
  <text class="s" x="630" y="218">シグナルで終了</text>
  <rect class="chip" x="812" y="114" width="124" height="52" rx="7"/>
  <rect class="warn" x="812" y="114" width="124" height="52" rx="7"/>
  <text class="hb warnt" x="822" y="132">exit 125</text>
  <text class="s" x="822" y="147">exit 0 の後で</text>
  <text class="s" x="822" y="160">pull が拒否・失敗</text>

  <!-- outcomes when the connection drops -->
  <rect class="chip" x="364" y="264" width="112" height="52" rx="7"/>
  <rect class="warn" x="364" y="264" width="112" height="52" rx="7"/>
  <text class="hb warnt" x="374" y="282">exit 125</text>
  <text class="s" x="374" y="297">同期中に切断：</text>
  <text class="s" x="374" y="310">何も実行されず</text>
  <rect class="chip" x="492" y="264" width="304" height="52" rx="7"/>
  <rect class="warn" x="492" y="264" width="304" height="52" rx="7"/>
  <text class="hb warnt" x="502" y="282">exit 125</text>
  <text class="s" x="502" y="297">実行中に切断：結果は不明。</text>
  <text class="s" x="502" y="310">コマンドが動いた可能性がある</text>

  <text class="s" x="480" y="372" text-anchor="middle">トレーラーのない 125 は sendaway の失敗。コマンド自身が 125 で終わったときは exit 125 のトレーラーが付く</text>
</svg>
