<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="960" height="376" role="img" aria-labelledby="sa-colja-t sa-colja-d">
  <title id="sa-colja-t">コマンド終了後に戻ってくるもの</title>
  <desc id="sa-colja-d">左にビルドホスト、右に Mac の 2 つの領域があります。コマンドが終了すると、ホストは終わり方に応じて 2 つの経路のどちらかをとります。終了コード 0 なら pull: のパスを回収します。存在しないパス、シンボリックリンク、アーカイブ、ネイティブバイナリ（ELF、Mach-O、PE、ar）は拒否され、1 件でも拒否があれば何もコピーせず終了コード 125 になります。受け入れたファイルはローカルのプロジェクトのツリーの、ルートからの相対パスが同じ場所にコピーされ、ローカルのファイルを上書きします。書き込み先のパスにシンボリックリンクが含まれていれば拒否されます。0 以外の終了コードやシグナルで終わった場合は artifacts: のパスを回収します。存在しないパスはスキップし、シンボリックリンクとネイティブバイナリは拒否し、アーカイブは受け入れ、合計は 64 MiB までで、拒否があっても終了コードは変わりません。これらのファイルは実行記録の artifacts ディレクトリに入り、プロジェクトのツリーには入りません。コマンドがホスト上で変更したのに回収されなかった同期済みファイルは「remote run modified N synced files (not copied back)」という警告に名前が出て、次の push でローカルの内容に上書きされます。実行記録のディレクトリには artifacts/、sendaway fetch で取得したファイルを置く fetched/、output.log、meta.json があり、新しい 100 件までを残し、14 日を超えたものは削除します。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    rect.warn { fill:#ffffff }
    .warnt, text.warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .code  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} rect.warn{fill:#161b22} .warnt,text.warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="sa-colja-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sa-colja-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="376" rx="12"/>

  <!-- panels -->
  <rect class="grp" x="24" y="36" width="560" height="294" rx="10"/>
  <rect class="grp" x="608" y="36" width="328" height="294" rx="10"/>
  <text class="lbl" x="40" y="58">ビルドホスト</text>
  <text class="lbl" x="624" y="58">Mac</text>

  <!-- connectors, drawn under the boxes -->
  <path class="ln" d="M192,159 H210 V112 H314" marker-end="url(#sa-colja-a)"/>
  <path class="ln2" d="M210,159 V206 H314" marker-end="url(#sa-colja-b)"/>
  <path class="ln" d="M568,112 H622" marker-end="url(#sa-colja-a)"/>
  <text class="s" x="220" y="105">exit 0</text>
  <text class="s" x="220" y="199">0 以外・シグナル</text>

  <!-- build host -->
  <rect class="card" x="40" y="130" width="152" height="58" rx="7"/>
  <text class="lbl" x="50" y="150">1</text>
  <text class="h" x="66" y="150">コマンド終了</text>
  <text class="s" x="66" y="166">終わり方に応じて</text>
  <text class="s" x="66" y="179">一方のリストを回収</text>

  <rect class="card" x="316" y="76" width="252" height="72" rx="7"/>
  <text class="lbl" x="326" y="96">2a</text>
  <text class="h" x="350" y="96">pull: のパス</text>
  <text class="s" x="350" y="112">拒否: 欠落、シンボリックリンク、</text>
  <text class="s" x="350" y="125">アーカイブ、ネイティブバイナリ</text>
  <text class="s warnt" x="350" y="138">1 件でも拒否なら回収なし、exit 125</text>

  <rect class="alt" x="316" y="170" width="252" height="72" rx="7"/>
  <text class="lbl" x="326" y="190">2b</text>
  <text class="h" x="350" y="190">artifacts: のパス</text>
  <text class="s" x="350" y="206">欠落はスキップ、シンボリックリンクと</text>
  <text class="s" x="350" y="219">ネイティブバイナリは拒否、アーカイブ可</text>
  <text class="s" x="350" y="232">合計 64 MiB まで、終了コードは不変</text>

  <rect class="warn" x="40" y="258" width="528" height="58" rx="7"/>
  <text class="lbl" x="50" y="278">3</text>
  <text class="h" x="66" y="278">ホストで変更されたが回収されない同期済みファイル</text>
  <text class="code" x="66" y="294">remote run modified N synced files (not copied back)</text>
  <text class="s" x="66" y="307">トレーラーの前に警告を表示し、次の push でローカルの内容に上書きされる</text>

  <!-- Mac -->
  <rect class="card" x="624" y="76" width="296" height="72" rx="7"/>
  <text class="h" x="638" y="96">プロジェクトのツリー</text>
  <text class="s" x="638" y="112">ルートからの相対パスで同じ場所へ</text>
  <text class="s" x="638" y="125">ローカルのファイルは上書き</text>
  <text class="s" x="638" y="138">書き込み先のパスにシンボリックリンクがあれば拒否</text>

  <rect class="alt" x="624" y="160" width="296" height="154" rx="7"/>
  <path class="ln2" d="M568,206 H636" marker-end="url(#sa-colja-b)"/>
  <text class="lbl" x="638" y="178">実行記録</text>
  <text class="code" x="718" y="178">sendaway/runs/&lt;id&gt;/</text>
  <rect class="chip" x="638" y="186" width="134" height="40" rx="5"/>
  <text class="code" x="648" y="203">artifacts/</text>
  <text class="s" x="648" y="217">失敗時の回収物</text>
  <rect class="chip" x="778" y="186" width="128" height="40" rx="5"/>
  <text class="code" x="788" y="203">fetched/</text>
  <text class="s" x="788" y="217">fetch で取得</text>
  <rect class="chip" x="638" y="234" width="134" height="40" rx="5"/>
  <text class="code" x="648" y="251">output.log</text>
  <text class="s" x="648" y="265">表示した全出力</text>
  <rect class="chip" x="778" y="234" width="128" height="40" rx="5"/>
  <text class="code" x="788" y="251">meta.json</text>
  <text class="s" x="788" y="265">コマンド・終了・時刻</text>
  <text class="s" x="638" y="298">新しい 100 件まで、14 日を超えたものは削除</text>

  <text class="s" x="480" y="356" text-anchor="middle">失敗した実行はプロジェクトのツリーに一切書き込まない。成功した実行が書き込むのは pull: のパスだけで、全部か無しか。</text>
</svg>
