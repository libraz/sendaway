<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="sa-trl-t sa-trl-d">
  <title id="sa-trl-t">The lines a run adds to stderr</title>
  <desc id="sa-trl-d">A terminal excerpt of one run. Lines that sendaway adds start with [sendaway]. The start line, build01 linux-amd64 · sync 0.42s, names the host, the host's OS and architecture, and the sync time. A not sent (secret-like) line lists withheld files such as .env. The command's own output follows unprefixed. When the command changed synced files that were not collected, a remote run modified 2 synced files (not copied back) warning names them. The trailer, build01 exit 1 · 42.3s · run r-20250101-120000-ab12 · log followed by the path of output.log, gives the host, the exit code or killed by signal N, the duration, the run id and the log path. All [sendaway] lines go to stderr, the trailer is the last line, and sendaway last prints the same run record.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .hb    { font-size:12.5px; font-weight:600 }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    .code  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; fill:#1f2328 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e} .code{fill:#e6edf3}
    }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="300" rx="12"/>

  <!-- terminal excerpt (stderr and stdout interleaved) -->
  <rect class="chip" x="168" y="46" width="768" height="160" rx="7"/>
  <text class="code" x="182" y="68" xml:space="preserve"><tspan class="mono" style="font-size:11px">[sendaway]</tspan> build01 linux-amd64 · sync 0.42s</text>
  <text class="code" x="182" y="88" xml:space="preserve"><tspan class="mono" style="font-size:11px">[sendaway]</tspan> not sent (secret-like): .env</text>
  <text class="code" x="182" y="108">cc -O2 -c src/gen.c -o build/gen.o</text>
  <text class="code" x="182" y="126">tests/parse.c:41: expected 3, got 2</text>
  <text class="code" x="182" y="146" xml:space="preserve"><tspan class="mono" style="font-size:11px">[sendaway]</tspan> remote run modified 2 synced files (not copied back): src/gen.c, src/gen.h</text>
  <text class="code" x="254.8" y="164">— add this target to local: or list the files in pull:</text>
  <text class="code" x="182" y="186" xml:space="preserve"><tspan class="mono" style="font-size:11px">[sendaway]</tspan> build01 exit 1 · 42.3s · run r-20250101-120000-ab12 · log …/output.log</text>

  <!-- line roles -->
  <text class="lbl" x="156" y="68" text-anchor="end">start</text>
  <text class="lbl" x="156" y="88" text-anchor="end">withheld, if any</text>
  <text class="lbl" x="156" y="108" text-anchor="end">command output</text>
  <text class="lbl" x="156" y="146" text-anchor="end">modified, if any</text>
  <text class="lbl" x="156" y="186" text-anchor="end">trailer, last line</text>
  <path class="rule" d="M162,98 V130"/>
  <path class="rule" d="M162,136 V168"/>

  <!-- start line fields -->
  <path class="ln" d="M255.8,57 V53 H300.2 V57 M278.0,53 V40"/>
  <text class="s" x="278.0" y="35" text-anchor="middle">host</text>
  <path class="ln" d="M308.8,57 V53 H379.6 V57 M344.2,53 V40"/>
  <text class="s" x="344.2" y="35" text-anchor="middle">host os-arch</text>
  <path class="ln" d="M401.5,57 V53 H465.7 V57 M433.6,53 V40"/>
  <text class="s" x="433.6" y="35" text-anchor="middle">sync time</text>

  <!-- trailer fields -->
  <path class="ln" d="M255.8,192 V196 H300.2 V192 M278.0,196 V219"/>
  <text class="s" x="278.0" y="230" text-anchor="middle">host</text>
  <path class="ln" d="M308.8,192 V196 H346.5 V192 M327.6,196 V239"/>
  <text class="s" x="327.6" y="250" text-anchor="middle">exit code, or killed by signal N</text>
  <path class="ln" d="M368.4,192 V196 H399.5 V192 M383.9,196 V219"/>
  <text class="s" x="383.9" y="230" text-anchor="middle">duration</text>
  <path class="ln" d="M447.8,192 V196 H591.4 V192 M519.6,196 V239"/>
  <text class="s" x="519.6" y="250" text-anchor="middle">run id</text>
  <path class="ln" d="M639.8,192 V196 H717.2 V192 M678.5,196 V219"/>
  <text class="s" x="678.5" y="230" text-anchor="middle">full path of output.log</text>

  <text class="s" x="480" y="284" text-anchor="middle">All [sendaway] lines go to stderr and the trailer is the last line; sendaway last prints the same run record</text>
</svg>
